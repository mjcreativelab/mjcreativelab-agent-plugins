<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f6f8fa; color: #1f2328; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #fff; border-bottom: 1px solid #d1d9e0; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 15px; font-weight: 600; }
  header .summary { font-size: 12px; color: #59636e; }
  .legend { display: flex; gap: 12px; font-size: 12px; margin-left: auto; align-items: center; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 4px; border-radius: 2px; border: 1.5px solid; vertical-align: -1px; }
  .legend .added::before { background: #dafbe1; border-color: #1a7f37; }
  .legend .modified::before { background: #fff8c5; border-color: #9a6700; }
  .legend .removed::before { background: #ffebe9; border-color: #cf222e; border-style: dashed; }
  .legend .unchanged::before { background: #fff; border-color: #d1d9e0; }
  main { flex: 1; position: relative; overflow: hidden; }
  svg#canvas { width: 100%; height: 100%; cursor: grab; display: block; }
  svg#canvas.dragging { cursor: grabbing; }
  .node { cursor: pointer; }
  .node rect { stroke-width: 1.5; }
  .node text { font-size: 12px; pointer-events: none; }
  .node text.type-label { font-size: 9px; fill: #59636e; }
  .node.added rect { fill: #dafbe1; stroke: #1a7f37; }
  .node.modified rect { fill: #fff8c5; stroke: #9a6700; }
  .node.removed rect { fill: #ffebe9; stroke: #cf222e; stroke-dasharray: 5 3; }
  .node.unchanged rect { fill: #fff; stroke: #d1d9e0; }
  .node.selected rect { stroke-width: 3; }
  path.edge { stroke: #8c959f; stroke-width: 1.2; fill: none; marker-end: url(#arrow); }
  #panel { position: absolute; top: 12px; right: 12px; width: 320px; max-height: 75%; overflow: auto; background: #fff; border: 1px solid #d1d9e0; border-radius: 8px; padding: 14px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.08); display: none; }
  #panel h2 { font-size: 14px; margin-bottom: 8px; padding-right: 20px; }
  #panel dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; }
  #panel dt { color: #59636e; }
  #panel dd { word-break: break-all; }
  #panel .close { position: absolute; top: 10px; right: 12px; cursor: pointer; border: none; background: none; font-size: 14px; color: #59636e; }
  #controls { position: absolute; bottom: 12px; left: 12px; display: flex; gap: 6px; }
  #controls button { width: 32px; height: 32px; border: 1px solid #d1d9e0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 15px; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span class="summary" id="summary"></span>
  <div class="legend">
    <span class="added">追加</span><span class="modified">変更</span><span class="removed">削除</span><span class="unchanged">関連（未変更）</span>
  </div>
</header>
<main>
  <svg id="canvas">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"></path>
      </marker>
    </defs>
    <g id="viewport"></g>
  </svg>
  <div id="panel"></div>
  <div id="controls">
    <button id="zoom-in" title="拡大">＋</button>
    <button id="zoom-out" title="縮小">－</button>
    <button id="zoom-reset" title="リセット">⟲</button>
  </div>
</main>
<script>
"use strict";
var GRAPH = __GRAPH_JSON__;

var NODE_W = 170;
var NODE_H = 52;
var SVG_NS = "http://www.w3.org/2000/svg";
var TYPE_LABELS = { module: "モジュール", library: "ライブラリ", model: "モデル", component: "コンポーネント" };
var STATUS_LABELS = { added: "追加", modified: "変更", removed: "削除", unchanged: "関連（未変更）" };

var svg = document.getElementById("canvas");
var viewport = document.getElementById("viewport");
var panel = document.getElementById("panel");

document.getElementById("title").textContent = GRAPH.title;
document.title = GRAPH.title;
document.getElementById("summary").textContent =
  "変更 " + GRAPH.summary.files + " ファイル / +" + GRAPH.summary.insertions + " −" + GRAPH.summary.deletions;

var nodeById = {};
GRAPH.nodes.forEach(function (n) { nodeById[n.id] = n; });

GRAPH.edges.forEach(function (e) {
  var a = nodeById[e.from];
  var b = nodeById[e.to];
  if (!a || !b) return;
  var x1, y1, x2, y2;
  if (b.x >= a.x + NODE_W) {
    x1 = a.x + NODE_W; y1 = a.y + NODE_H / 2;
    x2 = b.x;          y2 = b.y + NODE_H / 2;
  } else if (a.x >= b.x + NODE_W) {
    x1 = a.x;          y1 = a.y + NODE_H / 2;
    x2 = b.x + NODE_W; y2 = b.y + NODE_H / 2;
  } else if (b.y > a.y) {
    x1 = a.x + NODE_W / 2; y1 = a.y + NODE_H;
    x2 = b.x + NODE_W / 2; y2 = b.y;
  } else {
    x1 = a.x + NODE_W / 2; y1 = a.y;
    x2 = b.x + NODE_W / 2; y2 = b.y + NODE_H;
  }
  var mx = (x1 + x2) / 2;
  var my = (y1 + y2) / 2;
  var d;
  if (y1 === y2 || x1 === x2) {
    d = "M" + x1 + "," + y1 + " L" + x2 + "," + y2;
  } else if (Math.abs(x2 - x1) >= Math.abs(y2 - y1)) {
    d = "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2;
  } else {
    d = "M" + x1 + "," + y1 + " C" + x1 + "," + my + " " + x2 + "," + my + " " + x2 + "," + y2;
  }
  var path = document.createElementNS(SVG_NS, "path");
  path.setAttribute("d", d);
  path.setAttribute("class", "edge");
  viewport.appendChild(path);
});

GRAPH.nodes.forEach(function (n) {
  var g = document.createElementNS(SVG_NS, "g");
  g.setAttribute("class", "node " + n.status);
  g.setAttribute("transform", "translate(" + n.x + "," + n.y + ")");

  var rect = document.createElementNS(SVG_NS, "rect");
  rect.setAttribute("width", NODE_W);
  rect.setAttribute("height", NODE_H);
  rect.setAttribute("rx", 6);
  g.appendChild(rect);

  var typeText = document.createElementNS(SVG_NS, "text");
  typeText.setAttribute("x", 10);
  typeText.setAttribute("y", 16);
  typeText.setAttribute("class", "type-label");
  typeText.textContent = TYPE_LABELS[n.type] || n.type;
  g.appendChild(typeText);

  var label = document.createElementNS(SVG_NS, "text");
  label.setAttribute("x", 10);
  label.setAttribute("y", 36);
  label.textContent = n.label.length > 22 ? n.label.slice(0, 21) + "…" : n.label;
  g.appendChild(label);

  g.addEventListener("click", function (ev) {
    ev.stopPropagation();
    selectNode(n, g);
  });
  viewport.appendChild(g);
});

var selectedG = null;
function selectNode(n, g) {
  if (selectedG) selectedG.classList.remove("selected");
  selectedG = g;
  g.classList.add("selected");
  var detail = n.detail || {};
  panel.innerHTML = "";
  var close = document.createElement("button");
  close.className = "close";
  close.textContent = "✕";
  close.addEventListener("click", closePanel);
  var h2 = document.createElement("h2");
  h2.textContent = n.label;
  var dl = document.createElement("dl");
  [
    ["種別", TYPE_LABELS[n.type] || n.type],
    ["状態", STATUS_LABELS[n.status] || n.status],
    ["パス", detail.path || "-"],
    ["変更行", detail.lines || "-"],
    ["概要", detail.description || "-"]
  ].forEach(function (row) {
    var dt = document.createElement("dt");
    dt.textContent = row[0];
    var dd = document.createElement("dd");
    dd.textContent = row[1];
    dl.appendChild(dt);
    dl.appendChild(dd);
  });
  panel.appendChild(close);
  panel.appendChild(h2);
  panel.appendChild(dl);
  panel.style.display = "block";
}
function closePanel() {
  panel.style.display = "none";
  if (selectedG) { selectedG.classList.remove("selected"); selectedG = null; }
}

var scale = 1, tx = 20, ty = 20;
function applyTransform() {
  viewport.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")");
}
function zoomAt(cx, cy, factor) {
  var next = Math.min(4, Math.max(0.2, scale * factor));
  tx = cx - (cx - tx) * (next / scale);
  ty = cy - (cy - ty) * (next / scale);
  scale = next;
  applyTransform();
}
svg.addEventListener("wheel", function (ev) {
  ev.preventDefault();
  var r = svg.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.1 : 1 / 1.1);
}, { passive: false });

var drag = null;
svg.addEventListener("mousedown", function (ev) {
  drag = { x: ev.clientX, y: ev.clientY, tx: tx, ty: ty };
  svg.classList.add("dragging");
});
window.addEventListener("mousemove", function (ev) {
  if (!drag) return;
  tx = drag.tx + (ev.clientX - drag.x);
  ty = drag.ty + (ev.clientY - drag.y);
  applyTransform();
});
window.addEventListener("mouseup", function () {
  drag = null;
  svg.classList.remove("dragging");
});
svg.addEventListener("click", closePanel);
document.getElementById("zoom-in").addEventListener("click", function () {
  var r = svg.getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, 1.25);
});
document.getElementById("zoom-out").addEventListener("click", function () {
  var r = svg.getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, 0.8);
});
document.getElementById("zoom-reset").addEventListener("click", function () {
  scale = 1; tx = 20; ty = 20; applyTransform();
});
applyTransform();
</script>
</body>
</html>
